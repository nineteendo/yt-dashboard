<!DOCTYPE html>
<html>
<head>
    <title>Latest YouTube Video</title>
    <style>
        body {
            margin: 8px;
            height: calc(100vh - 16px);
            background: #111;
        }

        #player {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        function playLatest() {
            const params = new URLSearchParams(document.location.search);
            params.append("history", "1");
            const events = new EventSource(`/videos/events?${params}`);
            events.addEventListener("video", event => {
                const video = JSON.parse(event.data);
                const state = player.getPlayerState();
                if ([YT.PlayerState.ENDED, YT.PlayerState.PLAYING].includes(state)) {
                    player.loadVideoById(video.video_id);
                } else if ([YT.PlayerState.PAUSED, YT.PlayerState.CUED].includes(state)) {
                    player.cueVideoById(video.video_id);
                }
            });
        }

        let player;
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player("player", {
                width: "auto",
                height: "auto",
                events: {
                    onReady: playLatest
                }
            });
        };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
