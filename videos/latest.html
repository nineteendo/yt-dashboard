<!DOCTYPE html>
<html>
<head>
    <title>Latest YouTube Video</title>
    <style>
        html {
            background-color: #111;
        }

        body {
            margin: 0;
            height: 100vh;
            container-type: size;
        }

        #player-a, #player-b {
            display: block;
            max-width: 177.7778cqh;
            aspect-ratio: 16 / 9;
        }

        #player-a:not(.active), #player-b:not(.active) {
            display: none;
        }

        #stats {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 12px 16px;
            background-color: #000d;
            color: #fff;
            font-family: monospace;
        }

        #stats span {
            display: block;
            color: #aaa;
            font-size: 10px;
            text-transform: uppercase;
        }

        #stats strong {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="stats">
        <div><span>Avg watch time</span><strong id="watched">&mdash;s</strong></div>
    </div>
    <div id="player-a"></div>
    <div id="player-b"></div>
    <script>
        function playLatest() {
            const params = new URLSearchParams(document.location.search);
            params.append("history", "1");
            const events = new EventSource(`/videos/events?${params}`);
            events.addEventListener("video", event => {
                const video = JSON.parse(event.data);
                const activeState = players[activeIndex].getPlayerState();
                const inactiveState = players[1 - activeIndex].getPlayerState();
                if (
                    [YT.PlayerState.UNSTARTED, YT.PlayerState.ENDED, YT.PlayerState.PLAYING].includes(activeState)
                    && inactiveState !== YT.PlayerState.BUFFERING
                ) {
                    players[1 - activeIndex].loadVideoById(video.id);
                }
            });
            function updateStats() {
                const elapsed = (performance.now() - startTime) / 1000;
                if (count > 0) {
                    document.getElementById("watched").textContent = (elapsed / count).toFixed(2) + "s";
                }
            }
            const refreshIntervalId = setInterval(updateStats, 1000);
            events.addEventListener("done", event => {
                events.close();
                players[activeIndex].pauseVideo();
                clearInterval(refreshIntervalId);
            });
        }

        function createPlayer(id, otherId, index) {
            return new YT.Player(id, {
                width: "100%",
                height: "auto",
                events: {
                    onReady: () => {
                        ready++;
                        if (ready == 2) {
                            players[1].mute();
                            document.getElementById("player-a").classList.add("active");
                            playLatest();
                        }
                    },
                    onStateChange: event => {
                        if (activeIndex !== index && event.data === YT.PlayerState.PLAYING) {
                            count++;
                            const state = players[1 - index].getPlayerState();
                            const muted = players[1 - index].isMuted();
                            players[1 - index].pauseVideo();
                            players[1 - index].mute();
                            document.getElementById(otherId).classList.remove("active");
                            if ([YT.PlayerState.UNSTARTED, YT.PlayerState.ENDED, YT.PlayerState.PLAYING, YT.PlayerState.BUFFERING].includes(state)) {
                                players[index].playVideo();
                            } else {
                                players[index].pauseVideo();
                            }
                            if (!muted) {
                                players[index].unMute();
                            }
                            document.getElementById(id).classList.add("active");
                            activeIndex = index;
                        }
                    }
                }
            });
        }
        

        let players;
        let ready = 0;
        let activeIndex = 0;
        let count = 0;
        const startTime = performance.now();
        window.onYouTubeIframeAPIReady = () => {
            players = [
                createPlayer("player-a", "player-b", 0),
                createPlayer("player-b", "player-a", 1)
            ];
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
