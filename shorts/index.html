<!DOCTYPE html>
<html>
<head>
    <title>All YouTube Shorts</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
        }

        #shorts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(112.5px, 1fr));
        }

        #shorts a {
            padding: 4px 2.25px;
        }

        #shorts img {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
        }

        #stats {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 12px 16px;
            background-color: #000d;
            color: #fff;
            font-family: monospace;
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 10px 24px;
        }

        #stats span {
            display: block;
            color: #aaa;
            font-size: 10px;
        }

        #stats strong {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="stats">
        <div><span>NEW SHORTS</span><strong id="count">0</strong></div>
        <div><span>TIME ELAPSED</span><strong id="elapsed">00:00</strong></div>
        <div><span>SHORTS/MIN</span><strong id="arrival">0</strong></div>
        <div><span>AVG. INTERVAL</span><strong id="interval">-</strong></div>
    </div>
    <div id="shorts"></div>
    <script>
        const MAX_SHORTS = 1444;
        let count = 0;
        let startTime = performance.now();
        const grid = document.getElementById("shorts");
        const events = new EventSource(`/shorts/events${document.location.search}`);
        events.addEventListener("history", event => {
            count -= Number(event.data);
        });
        events.addEventListener("short", event => {
            const short = JSON.parse(event.data);

            const link = document.createElement("a");
            link.href = short.url;
            link.target = "_blank";
            link.rel = "noopener";
            link.title = short.title

            const image = document.createElement("img");
            image.src = `https://i.ytimg.com/vi/${short.video_id}/hqdefault.jpg`;
            image.loading = "lazy";

            link.appendChild(image);
            grid.prepend(link);
            count++;
            if (grid.children.length > MAX_SHORTS) {
                grid.lastElementChild.remove();
            }
        });
        function updateStats() {
            document.getElementById("count").textContent = count.toLocaleString();
            if (startTime !== null) {
                const elapsed = (performance.now() - startTime) / 1000;
                const hh = String(Math.floor(elapsed / 3600)).padStart(2, "0")
                const mm = String(Math.floor(elapsed / 60) % 60).padStart(2, "0")
                const ss = String(Math.floor(elapsed % 60)).padStart(2, "0")
                document.getElementById("elapsed").textContent = `${hh}:${mm}:${ss}`;
                if (count > 1) {
                    document.getElementById("arrival").textContent = (count / (elapsed / 60)).toFixed(0);
                    document.getElementById("interval").textContent = (elapsed / count).toFixed(2) + "s";
                }
            }
        }
        setInterval(updateStats, 1000);
    </script>
</body>
</html>
