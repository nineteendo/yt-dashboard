<!DOCTYPE html>
<html>
<head>
    <title>Latest YouTube Short</title>
    <style>
        html {
            background-color: #111;
        }

        body {
            margin: 0;
            height: 100vh;
            container-type: size;
        }

        #player-a, #player-b {
            display: block;
            max-height: 177.7778cqw;
            aspect-ratio: 9 / 16;
        }

        #player-a:not(.active), #player-b:not(.active) {
            display: none;
        }
    </style>
</head>
<body>
    <div id="player-a"></div>
    <div id="player-b"></div>
    <script>
        function playLatest() {
            const params = new URLSearchParams(document.location.search);
            params.append("history", "1");
            const events = new EventSource(`/shorts/events?${params}`);
            events.addEventListener("short", event => {
                const short = JSON.parse(event.data);
                const activeState = players[activeIndex].getPlayerState();
                const inactiveState = players[1 - activeIndex].getPlayerState();
                if (![activeState, inactiveState].includes(YT.PlayerState.BUFFERING)) {
                    if ([YT.PlayerState.ENDED, YT.PlayerState.PLAYING].includes(activeState)) {
                        players[1 - activeIndex].loadVideoById(video.video_id);
                    } else {
                        players[1 - activeIndex].cueVideoById(video.video_id);
                    }
                }
            });
        }

        function createPlayer(id, otherId, index) {
            return new YT.Player(id, {
                width: "auto",
                height: "100%",
                events: {
                    onReady: () => {
                        ready++;
                        if (ready == 2) {
                            players[1].mute();
                            document.getElementById("player-a").classList.add("active");
                            playLatest();
                        }
                    },
                    onStateChange: event => {
                        if (
                            activeIndex !== index
                            && [YT.PlayerState.PLAYING, YT.PlayerState.CUED].includes(event.data)
                        ) {
                            const state = players[1 - index].getPlayerState();
                            const muted = players[1 - index].isMuted();
                            players[1 - index].pauseVideo();
                            players[1 - index].mute();
                            document.getElementById(otherId).classList.remove("active");
                            if ([YT.PlayerState.ENDED, YT.PlayerState.PLAYING].includes(state)) {
                                players[index].playVideo();
                            } else {
                                players[index].pauseVideo();
                            }
                            if (!muted) {
                                players[index].unMute();
                            }
                            document.getElementById(id).classList.add("active");
                            activeIndex = index;
                        }
                    }
                }
            });
        }

        let players;
        let ready = 0;
        let activeIndex = 0;
        window.onYouTubeIframeAPIReady = () => {
            players = [
                createPlayer("player-a", "player-b", 0),
                createPlayer("player-b", "player-a", 1)
            ];
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
