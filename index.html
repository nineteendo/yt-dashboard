<!DOCTYPE html>
<head>
    <title>Live YouTube Subscriptions</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111827;
            color: #f9fafb;
            font-family: system-ui, sans-serif;
        }

        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            border-bottom: 1px solid #374151;
        }

        .navbar a {
            color: #9ca3af;
            font-size: 14px;
            text-decoration: none;
            transition: color 150ms ease;
        }

        .navbar a:hover {
            color: #93b4dc;
        }

        img {
            position: absolute;
            transform: translate(-50%, -100%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #1f2937;
        }

        main {
            width: 720px;
            max-width: calc(100% - 32px);
            padding: 48px 24px;
            text-align: center;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
        }

        h1, h2 {
            margin: 0 0 32px;
            color: #9ca3af;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #count {
            font-size: clamp(48px, 12vw, 96px);
            font-weight: 750;
            font-variant-numeric: tabular-nums;
            letter-spacing: -3px;
            line-height: 1.1;
            transition: color 200ms ease;
        }

        #count.updated {
            color: #93b4dc;
        }

        .progress {
            height: 7px;
            margin-top: 24px;
            overflow: hidden;
            background: #374151;
            border-radius: 4px;
        }

        #bar {
            width: 0;
            height: 100%;
            background: #93b4dc;
            border-radius: inherit;
            transition: width 400ms ease;
        }

        .goal {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/channels?page=0&limit=100">All YouTube Channels</a>
        <a href="/videos?top=500000&history=1444&replay=0">All YouTube Videos</a>
        <a href="/videos/latest?top=500000&replay=0">Latest YouTube Video</a>
        <a href="/shorts?top=500000&history=1444&replay=0">All YouTube Shorts</a>
        <a href="/shorts/latest?top=500000&replay=0">Latest YouTube Short</a>
    </nav>
    <main>
        <img src="/NZ1.png" alt="Nice Zombies logo">
        <h1>Nice Zombies</h1>
        <div id="count">500,000</div>
        <h2>Subscriptions</h2>
        <div class="progress">
            <div id="bar" style="width: 100%;"></div>
        </div>
        <div class="goal">
            <span id="percentage">100.00% complete</span>
            <span id="target">500,000 goal</span>
        </div>
    </main>
    <script>
        function updateCount(newCount) {
            if (animationFrame !== null) {
                cancelAnimationFrame(animationFrame);
            }

            if (goal !== null) {
                const progress = Math.min(newCount / goal * 100, 100);
                document.getElementById("bar").style.width = `${progress}%`;
                document.getElementById("percentage").textContent = `${progress.toFixed(2)}% complete`;
            }

            if (count === null) {
                count = newCount;
                document.getElementById("count").textContent = newCount.toLocaleString();
                return;
            }

            function animate(now) {
                const progress = Math.min((now - startTime) / 400, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const interpolatedCount = Math.round(count + (newCount - count) * eased);
                document.getElementById("count").textContent = interpolatedCount.toLocaleString();
                if (progress < 1) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    count = newCount;
                    animationFrame = null;
                    document.getElementById("count").classList.remove("updated");
                }
            }

            const startTime = performance.now();
            document.getElementById("count").classList.add("updated");
            animationFrame = requestAnimationFrame(animate);
        }

        let count = null;
        let goal = null;
        let animationFrame = null;
        const events = new EventSource("/events");
        events.addEventListener("goal", event => {
            goal = Number(event.data);
            document.getElementById("target").textContent = `${goal.toLocaleString()} goal`;
        });
        events.addEventListener("subscriptions", event => {
            updateCount(Number(event.data));
        });
        events.addEventListener("done", event => {
            events.close();
        });
    </script>
</body>
</html>
